##########           LIQUIBASE FLOWFILE                ##########
##########  learn more http://docs.liquibase.com/flow  ##########

globalVariables:
  ENV: ${ENVIRONMENT}
  UTILITY: ${LB_UTILITY}
  CHECKNAME: ${LB_CHECKNAME}
  TARGETING_TYPE: ${LB_TARGETING_TYPE}
  FILTER: ${LB_FILTER}
  FILTER_VALUE: ${LB_FILTER_VALUE}
  TARGETING_ID: ${LB_TARGETING_ID}
  TARGETING_REASON: ${LB_TARGETING_REASON}
  TARGETING_EXPIRATION: ${LB_TARGETING_EXPIRATION}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET}
  TARGETING_FILE: s3://${AWS_S3_BUCKET}/checks-targeting/liquibase.checks-settings.targeting.yaml
  CHECKS_SETTINGS_FILE: s3://${AWS_S3_BUCKET}/checks-targeting/liquibase.checks-settings.conf

stages:

  Checks Targeting:
    actions:    

      - type: shell
        if: "${UTILITY} == targeting_add"
        command: |
          #!/usr/bin/env bash
          set -e

          ARGS=(--checkname="${CHECKNAME}" --type="${TARGETING_TYPE}" --targeting-file="${TARGETING_FILE}" --checks-settings-file="${CHECKS_SETTINGS_FILE}")

          if [[ -n "${FILTER}" && -n "${FILTER_VALUE}" && "${FILTER_VALUE}" != "''" && "${FILTER}" != "''" ]]; then
            ARGS+=("--${FILTER}-filter=${FILTER_VALUE}")
          fi

          if [[ -n "${TARGETING_ID}" ]]; then
            ARGS+=(--id="${TARGETING_ID}")
          fi

          if [[ -n "${TARGETING_REASON}" ]]; then
            ARGS+=(--reason="${TARGETING_REASON}")
          fi

          if [[ -n "${TARGETING_EXPIRATION}" ]]; then
            ARGS+=(--expiration="${TARGETING_EXPIRATION}")
          fi

          echo "Running: liquibase checks targeting add ${ARGS[@]}"
          liquibase checks targeting add "${ARGS[@]}"

      - type: shell
        if: "${UTILITY} == targeting_remove"
        command: |
          #!/usr/bin/env bash
          set -e

          ARGS=(--id="${TARGETING_ID}" --targeting-file="${TARGETING_FILE}" --checks-settings-file="${CHECKS_SETTINGS_FILE}")

          echo "Running: liquibase checks targeting remove ${ARGS[@]}"
          liquibase checks targeting remove "${ARGS[@]}"

      - type: liquibase
        if: "${UTILITY} == targeting_list"
        command: checks targeting list
        cmdArgs: { targeting-file: "${TARGETING_FILE}", checks-settings-file: "${CHECKS_SETTINGS_FILE}" }
          

## The endStage ALWAYS RUNS. 
## So put actions here which you desire to perform whether previous stages' actions succeed or fail.
## If you do not want any actions to ALWAYS RUN, simply delete the endStage from your flow file.

endStage:
  actions:
    - type: liquibase
      if: "${UTILITY} != targeting_list"
      command: checks targeting list
      cmdArgs: { targeting-file: "${TARGETING_FILE}", checks-settings-file: "${CHECKS_SETTINGS_FILE}" }
          