## Note: Any command which fails in any stage below result in the command stopping, and endStage being run.
## A flow file can have one or more stages, each with multiple "actions", 
## or your flow file can have multiple stages with fewer actions in each stage.
globalVariables:
#  TARGETING_FILE: s3://${AWS_S3_BUCKET}/checks-targeting/liquibase.checks-settings.targeting.yaml
#  CHECKS_SETTINGS_FILE: s3://${AWS_S3_BUCKET}/checks-targeting/liquibase.checks-settings.conf
  #TARGETING_FILE: liquibase.checks-settings.targeting.yaml
  #CHECKS_SETTINGS_FILE: liquibase.checks-settings.conf
  TARGETING_FILE: liquibase.checks-package.targeting.yaml
  CHECKS_SETTINGS_FILE: liquibase.checks-package.yaml
  CHECKS_PACKAGES_FILE: security.pkg
  
stages:
  Validation:
    actions: 
      - type: liquibase
        command: validate

  # Status:
  #   actions:
  #     - type: liquibase
  #       command: status
  #       cmdArgs: {verbose: true}
       
  Checks-Changelog:
    actions:
      - type: liquibase
        command: checks run
#        cmdArgs: {checks-scope: changelog, changeset-filter: "PENDING"}
#        cmdArgs: {checks-scope: changelog, targeting-file: "${TARGETING_FILE}", checks-settings-file: "${CHECKS_SETTINGS_FILE}"}
        cmdArgs: {checks-scope: changelog, targeting-file: "${TARGETING_FILE}", checks-settings-file: "${CHECKS_SETTINGS_FILE}", checks-packages: "${CHECKS_PACKAGES_FILE}"}
        globalArgs: { reports-name: "checks-changelog-report.html"}

  # Update-SQL:
  #   actions:
  #     - type: liquibase
  #       command: update-sql
  #       globalArgs: { reports-name: "dry-run-report.html"}

  # Update:
  #   actions:
  #     - type: liquibase
  #       command: update
  #       globalArgs: { reports-name: "update-report.html"}

  # Checks-Database:
  #   actions:
  #     - type: liquibase
  #       command: checks run
  #       cmdArgs: {checks-scope: database, targeting-file: "${TARGETING_FILE}", checks-settings-file: "${CHECKS_SETTINGS_FILE}"}
  #       globalArgs: { reports-name: "checks-database-report.html"}

## The endStage ALWAYS RUNS. 
## So put actions here which you desire to perform whether previous stages' actions succeed or fail.
