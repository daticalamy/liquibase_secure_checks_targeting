####################################################################
#  GitHub Action to perform various Liquibase utilities.
#####################################################################
name: 'Liquibase Secure Checks Targeting'
run-name: ${{ inputs.environment}} checks targeting by ${{ github.actor }}

on:
  workflow_dispatch:
    # Following are the inputs received via the GitHubActions Run workflow dialog
    inputs:
      # The type 'environment' will automatically pull in the environments created in GitHub
      environment:
        description: 'Environment'
        type: environment
        required: true     

      utility:
        description: 'Utility to run'
        type: choice
        required: true
        options:
        - targeting_add
        - targeting_list
        - targeting_remove

      targeting_checkname:
        description: 'Check name to target'
        type: choice
        required: true
        options:
          - SqlGrantWarn                # Warn on Detection of 'GRANT' Statements
          - SqlRevokeWarn                # Warn on Detection of 'REVOKE' Statements
          - ChangeDropTableWarn          # Warn when 'DROP TABLE' detected
          - ChangeDropColumnWarn         # Warn when 'DROP COLUMN' detected
          - ModifyDataTypeWarn           # Warn when 'MODIFY <column>' detected
          - SqlSelectStarWarn            # Warn on Detection of 'SELECT *'
          - ChangeTruncateTableWarn      # Warn when 'TRUNCATE TABLE' detected
          - SqlGrantOptionWarn           # Warn on Detection of grant containing 'WITH GRANT OPTION'
          - SqlGrantAdminWarn            # Warn on Detection of grant containing 'WITH ADMIN OPTION'
          - RollbackRequired             # Rollback Required for Changeset
          - FormattedSqlHeaderRequired   # Check for Formatted SQL header

      targeting_filter:
        description: 'Targeting filter'
        type: choice
        required: false
        options:
        - conditions
        - keywords
        - releases
        - teams

      targeting_filter_value:
        description: 'Targeting filter value'
        type: string
        required: false

      targeting_expiration:
        description: 'Targeting expiration (eg. 2h, 30m, 24h30m, 2w3d)'
        type: string
        required: false

      targeting_id:
        description: 'Targeting ID'
        type: string
        required: false

      targeting_reason:
        description: 'Targeting Reason'
        type: string
        required: false
      
      targeting_type:
        description: 'Targeting Type'
        type: choice
        required: false
        options:
        - ignore
        - include

####################################################################
### Include permissions for OIDC
#####################################################################
permissions:
  id-token: write
  contents: read # If not writing back to the repo set to read
        
####################################################################
#  Set up the environment
#####################################################################
env:
  # AWS S3 bucket is the host part of the S3 bucket
  AWS_S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  
  # License key
  LIQUIBASE_LICENSE_KEY: ${{ secrets.LIQUIBASE_LICENSE_KEY }}
  
  # JDBC URL of the database per environment
  # See https://docs.liquibase.com/workflows/liquibase-community/using-jdbc-url-in-liquibase.html
  LIQUIBASE_COMMAND_URL: ${{ vars.LIQUIBASE_URL }}

  # Credentials for the environment's database https://docs.liquibase.com/parameters/command-parameters.html
  LIQUIBASE_COMMAND_USERNAME: ${{ secrets.LIQUIBASE_USERNAME }}
  LIQUIBASE_COMMAND_PASSWORD: ${{ secrets.LIQUIBASE_PASSWORD }}

  # Liquibase schema: Specified to allow flexibility in storage of Liquibase Change Tracking Tables
  # See https://docs.liquibase.com/parameters/liquibase-schema-name.html
  LIQUIBASE_LIQUIBASE_SCHEMA_NAME: abc
  
  # Default schema: Specify schema for all changes
  LIQUIBASE_COMMAND_DEFAULT_SCHEMA_NAME: abc

  # Search path (See https://docs.liquibase.com/concepts/changelogs/how-liquibase-finds-files.html)
  LIQUIBASE_SEARCH_PATH: flows,checks,changelogs

  # The database changelog. See https://docs.liquibase.com/concepts/changelogs/working-with-changelogs.html
  LIQUIBASE_COMMAND_CHANGELOG_FILE: rootchangelog.yaml
  
  ENVIRONMENT: ${{ inputs.environment }}
  LB_UTILITY: ${{ inputs.utility }}
  
  # Values: OFF, SEVERE, WARNING, INFO, FINE
  LIQUIBASE_LOG_LEVEL: INFO
  LIQUIBASE_LOG_FORMAT: JSON_PRETTY
  LIQUIBASE_LOG_FILE: logs/log.json

  # History Table
  LIQUIBASE_DBCLHISTORY_ENABLED: true

  # Targeting
  LB_CHECKNAME: ${{ inputs.targeting_checkname }}
  LB_TARGETING_TYPE: ${{ inputs.targeting_type }}
  LB_FILTER: ${{ inputs.targeting_filter }}
  LB_FILTER_VALUE: ${{ inputs.targeting_filter_value }}
  LB_TARGETING_EXPIRATION: ${{ inputs.targeting_expiration }}
  LB_TARGETING_ID: ${{ inputs.targeting_id }}
  LB_TARGETING_REASON: ${{ inputs.targeting_reason }}

  LIQUIBASE_COMMAND_CHECKS_TARGETING_ADD_AUTO_UPDATE: false

jobs:
  #########################################################################
  #  Run Checks Targeting
  #########################################################################

  database-checks-targeting:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

###
### Retrieve AWS credentials
### Requires an AWS IAM role with token.actions.githubusercontent.com web identity provider
### Provider URL: https://token.actions.githubusercontent.com
### Audience: sts.amazonaws.com
###
    - name: Debug OIDC token claims
      shell: bash
      run: |
        TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
        echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .
      env:
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}

    - name: Retrieving AWS credentials
      uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
      with:
        role-to-assume: ${{ secrets.AWS_ROLE }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Log Inputs
      shell: bash
      run: |
        echo "=================================================="
        echo " Liquibase Checks Targeting - Run Inputs"
        echo "=================================================="
        echo "Environment:            ${{ inputs.environment }}"
        echo "Utility:                ${{ inputs.utility }}"
        echo "Targeting Check Name:   ${{ inputs.targeting_checkname }}"
        echo "Targeting Filter:       ${{ inputs.targeting_filter }}"
        echo "Targeting Filter Value: ${{ inputs.targeting_filter_value }}"
        echo "Targeting Expiration:   ${{ inputs.targeting_expiration }}"
        echo "Targeting ID:           ${{ inputs.targeting_id }}"
        echo "Targeting Reason:       ${{ inputs.targeting_reason }}"
        echo "Targeting Type:         ${{ inputs.targeting_type }}"
        echo "Triggered By:           ${{ github.actor }}"
        echo "=================================================="

        {
          echo "### Liquibase Checks Targeting - Run Inputs"
          echo ""
          echo "| Input | Value |"
          echo "|---|---|"
          echo "| Environment | ${{ inputs.environment }} |"
          echo "| Utility | ${{ inputs.utility }} |"
          echo "| Targeting Check Name | ${{ inputs.targeting_checkname }} |"
          echo "| Targeting Filter | ${{ inputs.targeting_filter }} |"
          echo "| Targeting Filter Value | ${{ inputs.targeting_filter_value }} |"
          echo "| Targeting Expiration | ${{ inputs.targeting_expiration }} |"
          echo "| Targeting ID | ${{ inputs.targeting_id }} |"
          echo "| Targeting Reason | ${{ inputs.targeting_reason }} |"
          echo "| Targeting Type | ${{ inputs.targeting_type }} |"
          echo "| Triggered By | ${{ github.actor }} |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Setup Liquibase Environment
      uses: ./.github/workflows/setup-liquibase
    
    - name: Liquibase Checks Targeting Flow
      shell: bash
      run: |
        liquibase flow --flow-file=liquibase-checks-targeting.flowfile.yaml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Auto-generated

    - name: Upload Checks Targeting Settings Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.environment }}-checks-targeting-settings
        path: checks/liquibase.checks-settings.targeting.yaml
        if-no-files-found: error