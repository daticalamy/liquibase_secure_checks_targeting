## Liquibase Checks Targeting
## Rules here apply automatically whenever 'checks run' is executed against the paired
## checks-settings file. See: https://docs.liquibase.com/policy-checks
## 'ignore' rules still evaluate a check everywhere but never fail the build on a match.
## 'include' rules narrow a check to ONLY the matching changesets -- everything else is skipped
## (not evaluated, not reported) for that check.
## Only 'checkName' is required on a rule. 'id' (see 'checks targeting list'/'remove') defaults to
## the check name and is not stored unless you set your own; 'created' is an optional yyyy-MM-dd note.

created: '2026-07-30'
ignore:
- checkName: RollbackRequired
  created: '2026-08-03'
  sourceFile: liquibase.checks-settings.conf
- checkName: SqlGrantWarn
  created: '2026-08-03'
  filter:
    keywords: 'monkey_business'
  reason: this team is allowed to have grants
  sourceFile: liquibase.checks-settings.conf
include: []
version: '1.0'